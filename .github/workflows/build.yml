name: build
permissions:
  contents: read

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'Docs/**'       # Docs folder in root of repo
      - '**/*.md'       # .md files anywhere in the repo
      - '**/LICENSE'    # LICENSE files anywhere in the repo
      - '**/.gitignore' # .gitignore files anywhere in the repo
      
  pull_request:
    branches: [main]
    paths-ignore:
      - 'Docs/**'       # Docs folder in root of repo
      - '**/*.md'       # .md files anywhere in the repo
      - '**/LICENSE'    # LICENSE files anywhere in the repo
      - '**/.gitignore' # .gitignore files anywhere in the repo
      
  workflow_dispatch:
    
  schedule:
  - cron: '40 12 * * *'   # once a day @ 12:40pm UTC (5:40am PST)

env:
  SCHEME: swift-testing-extensions
  WORKSPACEPATH: .swiftpm/xcode/package.xcworkspace

jobs:
  macOS:
    name: Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@main
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    - name: Build
      run: |
        PARAMS=(
          -skipMacroValidation
          -workspace "$WORKSPACEPATH"
          -scheme "$SCHEME"
          -destination "generic/platform=macOS"
        )
        xcodebuild build "${PARAMS[@]}" | xcbeautify --renderer github-actions && exit ${PIPESTATUS[0]}
    - name: Unit Tests
      run: |
        PARAMS=(
          -skipMacroValidation
          -workspace "$WORKSPACEPATH"
          -scheme "$SCHEME"
          -destination "platform=macOS"
        )
        xcodebuild test "${PARAMS[@]}" | xcbeautify --renderer github-actions && exit ${PIPESTATUS[0]}
  
  macCatalyst:
    name: Tests (macCatalyst)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@main
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    - name: Build
      run: |
        # As a workaround for flakey pre-builds included in SwiftSyntax, we have to disable them when testing any platform that isn't macOS
        # See: https://github.com/swiftlang/swift-syntax/issues/2421#issuecomment-3542406416
        PARAMS=(
          -skipMacroValidation
          -workspace "$WORKSPACEPATH"
          -scheme "$SCHEME"
          -destination "generic/platform=macOS,variant=Mac Catalyst"
          -IDEPackageEnablePrebuilts=NO
        )
        xcodebuild build "${PARAMS[@]}" | xcbeautify --renderer github-actions && exit ${PIPESTATUS[0]}
    - name: Delete Derived Data
      run: rm -rf ~/Library/Developer/Xcode/DerivedData
    - name: Unit Tests
      run: |
        # As a workaround for flakey pre-builds included in SwiftSyntax, we have to disable them when testing any platform that isn't macOS
        # See: https://github.com/swiftlang/swift-syntax/issues/2421#issuecomment-3542406416
        PARAMS=(
          -skipMacroValidation
          -workspace "$WORKSPACEPATH"
          -scheme "$SCHEME"
          -destination "platform=macOS,variant=Mac Catalyst"
          -IDEPackageEnablePrebuilts=NO
        )
        xcodebuild test "${PARAMS[@]}" | xcbeautify --renderer github-actions && exit ${PIPESTATUS[0]}
  
  device-simulators:
    name: Tests
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [iOS, tvOS, watchOS, visionOS]
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@main
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    - name: Prepare Device Simulator
      id: sim-setup
      uses: orchetect/setup-xcode-simulator@v1
      with:
        refresh: true
        download: true
        scheme: ${{ env.SCHEME }}
        target: ${{ matrix.target }}
    - name: Build
      run: |
        # As a workaround for flakey pre-builds included in SwiftSyntax, we have to disable them when testing any platform that isn't macOS
        # See: https://github.com/swiftlang/swift-syntax/issues/2421#issuecomment-3542406416
        PARAMS=(
          -skipMacroValidation
          -workspace "$WORKSPACEPATH"
          -scheme "$SCHEME"
          -destination "generic/platform=$PLATFORMSHORT"
          -IDEPackageEnablePrebuilts=NO
        )
        xcodebuild build "${PARAMS[@]}" | xcbeautify --renderer github-actions && exit ${PIPESTATUS[0]}
      env:
        PLATFORMSHORT: ${{ steps.sim-setup.outputs.platform-short }}
        WORKSPACEPATH: ${{ steps.sim-setup.outputs.workspace-path }}
    - name: Delete Derived Data
      run: rm -rf ~/Library/Developer/Xcode/DerivedData
    - name: Unit Tests
      run: |
        # As a workaround for flakey pre-builds included in SwiftSyntax, we have to disable them when testing any platform that isn't macOS
        # See: https://github.com/swiftlang/swift-syntax/issues/2421#issuecomment-3542406416
        PARAMS=(
          -skipMacroValidation
          -workspace "$WORKSPACEPATH"
          -scheme "$SCHEME"
          -destination "platform=$PLATFORM,id=$ID"
          -IDEPackageEnablePrebuilts=NO
        )
        xcodebuild test "${PARAMS[@]}" | xcbeautify --renderer github-actions && exit ${PIPESTATUS[0]}
      env:
        ID: ${{ steps.sim-setup.outputs.id }}
        PLATFORM: ${{ steps.sim-setup.outputs.platform }}
        WORKSPACEPATH: ${{ steps.sim-setup.outputs.workspace-path }}

  integration-tests:
    name: Integration Tests
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package: [TestWithoutResources, TestWithResources]
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@main
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    - name: Build
      env:
        PACKAGE: ${{ matrix.package }}
      run: |
        cd "Integration Tests/$PACKAGE"
        PARAMS=(
          -skipMacroValidation
          -workspace "$WORKSPACEPATH"
          -scheme "$PACKAGE"
          -destination "generic/platform=macOS"
        )
        xcodebuild build "${PARAMS[@]}" | xcbeautify --renderer github-actions && exit ${PIPESTATUS[0]}
    - name: Unit Tests
      env:
        PACKAGE: ${{ matrix.package }}
      run: |
        cd "Integration Tests/$PACKAGE"
        PARAMS=(
          -skipMacroValidation
          -workspace "$WORKSPACEPATH"
          -scheme "$PACKAGE"
          -destination "platform=macOS"
        )
        xcodebuild test "${PARAMS[@]}" | xcbeautify --renderer github-actions && exit ${PIPESTATUS[0]}

  linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@main
    # As a workaround for flakey pre-builds included in SwiftSyntax, we have to disable them when testing any platform that isn't macOS
    # See: https://github.com/swiftlang/swift-syntax/issues/2421#issuecomment-3542406416
    - name: Build
      run: swift build --disable-experimental-prebuilts
    - name: Delete Build Folder
      run: rm -rf .build/
    - name: Unit Tests
      run: swift test --disable-experimental-prebuilts

  android:
    name: Build (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_TRIPLE: aarch64-unknown-linux-android28
    steps:
    - uses: actions/checkout@main
    - uses: orchetect/setup-swift-android-sdk@v1
      with:
        target-triple: ${{ env.TARGET_TRIPLE }}
    # As a workaround for flakey pre-builds included in SwiftSyntax, we have to disable them when testing any platform that isn't macOS
    # See: https://github.com/swiftlang/swift-syntax/issues/2421#issuecomment-3542406416
    - name: Build
      run: swift build --swift-sdk "$TARGET_TRIPLE" --static-swift-stdlib --disable-experimental-prebuilts

  wasm-on-linux:
    name: Build (WASM on Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_TRIPLE: wasm32-unknown-wasip1
    steps:
    - uses: actions/checkout@main
    - name: Prepare SDK
      uses: orchetect/setup-swift-wasm-sdk@v1
      id: sdk-setup
      with:
        target-triple: ${{ env.TARGET_TRIPLE }}
    - name: Build
      run: swift build --swift-sdk "$SDK_ID" --triple "$TARGET_TRIPLE"
      env:
        SDK_ID: ${{ steps.sdk-setup.outputs.id }}

  wasm-on-macos:
    name: Build (WASM on macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TARGET_TRIPLE: wasm32-unknown-wasip1
    steps:
    - uses: actions/checkout@main
    # Note: The Swift toolchain that ships with Xcode (which is the default Swift toolchain on macOS GitHub runners)
    # has a bug that causes the build to crash. The workaround is to use a standalone Swift toolchain.
    - name: Install swiftly and latest Swift toolchain
      uses: swift-actions/setup-swift@v3
    - name: Prepare SDK
      uses: orchetect/setup-swift-wasm-sdk@v1
      id: sdk-setup
      with:
        target-triple: ${{ env.TARGET_TRIPLE }}
    - name: Build
      run: swift build --swift-sdk "$SDK_ID" --triple "$TARGET_TRIPLE"
      env:
        SDK_ID: ${{ steps.sdk-setup.outputs.id }}
